<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Vervision 本地项目交接阅读器">
  <title>Vervision · 项目交接</title>
  <link rel="stylesheet" href="/app.css">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('vervision-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Vervision <span id="version">本地阅读器</span></a>
    <div class="top-actions">
      <span class="readonly">只读浏览</span>
      <button id="refreshBtn" class="secondary" title="重新读取项目文件">刷新</button>
      <button id="themeBtn" class="icon-btn" aria-label="切换深浅主题" title="切换深浅主题">◐</button>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <label class="field-label" for="projectSelect">我的项目</label>
      <select id="projectSelect" aria-label="选择项目"><option value="">选择已有项目</option></select>
      <form id="openForm" class="open-form">
        <label class="field-label" for="pathInput">打开其他项目</label>
        <div class="path-control"><input id="pathInput" required placeholder="D:\your-project" aria-label="项目文件夹路径" autocomplete="off"><button class="primary" type="submit">打开</button></div>
        <p class="hint">输入项目或 .handoff 文件夹路径，无需登记。</p>
      </form>
      <div id="projectPath" class="project-path"></div>
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" aria-label="搜索交接文件" placeholder="搜索标题、路径或正文" disabled></label>
      <nav id="documentList" aria-label="交接文件"></nav>
      <div class="side-foot"><span id="documentCount">本地文件 · 按需读取</span></div>
    </aside>
    <section class="content" id="content" aria-live="polite">
      <div class="empty-state"><span class="empty-mark">V</span><p class="eyebrow">你的项目，原地阅读</p><h1>打开一份项目交接</h1><p>选择左侧项目，或输入项目文件夹路径。<br>概览、模块知识与任务记录，都在这里。</p><p class="hint">文件留在本机，阅读不会修改项目。</p></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
